[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "room-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115,<1.0",
	"pydantic-settings>=2.6,<3.0",
	"pwdlib[argon2]>=0.2,<1.0",
	"redis>=5.0,<7.0",
	"uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
